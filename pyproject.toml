[project]
name = "dental-operations-intelligence"
version = "0.1.0"
description = "Modular backend foundation for Dental Operations Intelligence"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "asyncpg>=0.30",
    "email-validator>=2.2",
    "fastapi>=0.115",
    "pwdlib[argon2]>=0.2",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: requires PostgreSQL via TEST_DATABASE_URL",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests", "migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.ruff.format]
quote-style = "double"
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "tests"]
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
pretty = true
show_error_codes = true
