# Local stack for the API, PostgreSQL, and Redis.
# Redis is started for a future worker. The API process does not connect to it.
# This file does not run Alembic. Apply migrations with the command in README.md.

name: dental-ops

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      APP_NAME: Dental Operations Intelligence
      ENVIRONMENT: local
      DEBUG: "false"
      LOG_LEVEL: INFO
      API_PREFIX: /api/v1
      DATABASE_URL: postgresql+asyncpg://dental:dental@postgres:5432/dental
      DATABASE_CONNECT_TIMEOUT_SECONDS: "5"
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: dental
      POSTGRES_PASSWORD: dental
      POSTGRES_DB: dental
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dental -d dental"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
